name: Conteudo gratuito

# Sem "schedule": quem dispara é o cron-job.org (horas 7, 9, 11, 13, 15 e 17,
# minuto 0, fuso America/Sao_Paulo). Assim não há risco de postar em dobro.
on:
  workflow_dispatch:
    inputs:
      pilar:
        description: "Opcional: 0 Cripto, 1 Termometro BR, 2 Giro Global, 3 Sala de Trade, 4 Radar IA, 5 Clima"
        required: false
        default: ""

# Se dois disparos chegarem juntos, o segundo espera o primeiro terminar.
concurrency:
  group: conteudo-gratuito
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fonte para a imagem
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Dependencias
        run: pip install requests pillow

      - name: Publicar no Telegram
        run: python content_free.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCAR_PILAR: ${{ github.event.inputs.pilar }}
